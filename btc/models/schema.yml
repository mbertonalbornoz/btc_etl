version: 2

models:
  - name: stg_btc
    columns:
      - name: HASH_KEY
        tests:
          - unique
          - not_null

  - name: stg_btc_outputs
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('stg_btc_outputs_py')

  - name: whale_alert
    latest_version: 2
    config:
      contract:
        enforced: true
    columns:
      - name: output_address
        data_type: string
      - name: total_sent
        data_type: float
      - name: total_sent_usd
        data_type: float
      - name: t_count
        data_type: int
        tests:
          - assert_valid_btc_address

    versions:
      - v: 1
        # Matches above
        deprecation_date: 2026-06-01
        config:
          enabled: false
      - v: 2
        columns:
          # Removes just the total_sent_usd col and gets all the others
          - include: all
            exclude: [total_sent_usd]